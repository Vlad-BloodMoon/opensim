name: WebRTC P2P test

on:
  push:
    branches: ["**"]
    paths:
      - "OpenSim/Addons/os-webrtc-janus/**"
      - "webrtc-tests/**"
      - ".github/workflows/webrtc-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate OpenSim solution
        run: bash runprebuild.sh
      - name: Build OpenSim
        run: dotnet build -c Release OpenSim.sln
      - name: Build guard tests
        run: dotnet build -c Release webrtc-tests/P2PGuards.csproj
      - name: Run guard tests
        run: dotnet webrtc-tests/bin/Release/net8.0/P2PGuards.dll bin
      - name: Package experimental region module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p webrtc-package
          cp bin/WebRtcVoiceRegionModule.dll webrtc-package/
          cp bin/WebRtcVoiceRegionModule.pdb webrtc-package/
          cp webrtc-tests/README.md webrtc-package/README.md
          git rev-parse HEAD > webrtc-package/COMMIT.txt
          cd webrtc-package
          sha256sum WebRtcVoiceRegionModule.dll WebRtcVoiceRegionModule.pdb > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: webrtc-p2p-test
          path: webrtc-package/
          if-no-files-found: error
          retention-days: 30
