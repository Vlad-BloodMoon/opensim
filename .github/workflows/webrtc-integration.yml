name: Build Sandbox WolfVoice transport test
on:
  push:
    branches: ["test/sandbox-wolfvoice-no-pooling"]
    paths: ["OpenSim/Addons/os-webrtc-janus/**", ".github/workflows/webrtc-integration.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: bash runprebuild.sh
      - run: dotnet build -c Release OpenSim.sln
      - name: Package matching modules
        run: |
          set -eu
          mkdir package
          cp bin/WebRtcVoice.dll bin/WebRtcVoice.pdb package/
          git rev-parse HEAD > package/COMMIT.txt
          cd package
          sha256sum *.dll *.pdb > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: webrtc-sandbox-no-pooling
          path: package/
          if-no-files-found: error
