name: BloodMoon WebRTC P2P test

on:
  push:
    branches: ["bloodmoon/p2p-voice-test"]
    paths:
      - "OpenSim/Addons/os-webrtc-janus/**"
      - "bloodmoon-tests/**"
      - ".github/workflows/bloodmoon-webrtc-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    if: github.repository == 'Vlad-BloodMoon/opensim'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate OpenSim solution
        run: bash runprebuild.sh
      - name: Build OpenSim
        run: dotnet build -c Release OpenSim.sln
      - name: Build guard tests
        run: dotnet build -c Release bloodmoon-tests/P2PGuards.csproj
      - name: Run guard tests
        run: dotnet bloodmoon-tests/bin/Release/net8.0/P2PGuards.dll bin
      - name: Package experimental region module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bloodmoon-package
          cp bin/WebRtcVoiceRegionModule.dll bloodmoon-package/
          cp bin/WebRtcVoiceRegionModule.pdb bloodmoon-package/
          cp bloodmoon-tests/README.md bloodmoon-package/README.md
          git rev-parse HEAD > bloodmoon-package/COMMIT.txt
          cd bloodmoon-package
          sha256sum WebRtcVoiceRegionModule.dll WebRtcVoiceRegionModule.pdb > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: bloodmoon-webrtc-p2p-test
          path: bloodmoon-package/
          if-no-files-found: error
          retention-days: 30
